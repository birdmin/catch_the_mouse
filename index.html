<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치즈를 지켜라! (Catch the Mouse)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #2c3e50;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    h1 {
      margin: 10px 0;
      color: #f1c40f;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .game-container {
      background-color: #34495e;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
    }

    .status-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      background-color: #1e2b37;
      padding: 15px 25px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .status-item span {
      color: #e74c3c;
    }
    
    .status-item #cheese-display {
      color: #f1c40f;
    }

    .main-content {
      display: flex;
      gap: 20px;
      width: 100%;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* 게임 판 (3x3 구멍) 및 커서 설정 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      grid-template-rows: repeat(3, 160px);
      gap: 15px;
      background-color: #8e44ad;
      padding: 15px;
      border-radius: 10px;
      cursor: url('hammer.png') 15 15, auto;
    }

    .grid:active {
      cursor: url('hammer_hit.png') 15 15, auto;
    }

    .hole {
      position: relative;
      background-color: #4a235a;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: inset 0 10px 10px rgba(0, 0, 0, 0.7);
    }

    .mouse {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 100%;
      background-image: url('mouse_popup.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: top 0.1s ease-out;
    }

    .mouse.up {
      top: 0;
    }

    /* 사이드바 (기록판) */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 260px;
    }

    .record-box {
      background-color: #1e2b37;
      padding: 15px;
      border-radius: 10px;
    }

    .record-box h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #f1c40f;
      border-bottom: 2px solid #34495e;
      padding-bottom: 5px;
      font-size: 1.1rem;
    }

    .record-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.95rem;
    }

    .record-list li {
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #2c3e50;
    }

    .controls {
      margin-top: 20px;
    }

    .btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: #2ecc71;
      transform: translateY(-2px);
    }

    .btn:disabled {
      background-color: #7f8c8d;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <h1>🧀 치즈를 지켜라!</h1>

  <div class="game-container">
    <div class="status-board">
      <div class="status-item">남은 시간: <span id="time-display">30</span>초</div>
      <div class="status-item">잡은 쥐: <span id="score-display">0</span>마리</div>
      <div class="status-item">남은 치즈: <span id="cheese-display">🧀🧀🧀🧀🧀</span></div>
    </div>

    <div class="main-content">
      <!-- 3x3 필드 -->
      <div class="grid">
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
      </div>

      <!-- 명예의 전당 및 최근 기록 -->
      <div class="sidebar">
        <div class="record-box">
          <h3>🏆 명예의 전당 (TOP 3)</h3>
          <ol class="record-list" id="hall-of-fame">
            <li>기록 없음</li>
          </ol>
        </div>

        <div class="record-box">
          <h3>🕒 최근 플레이 기록</h3>
          <ul class="record-list" id="recent-records">
            <li>기록 없음</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn">게임 시작</button>
    </div>
  </div>

  <script>
    // 상태 변수
    let score = 0;
    let cheeseCount = 5;
    let timeRemaining = 30;
    let isGameRunning = false;
    let lastHole = null;
    let isHit = false;

    // 타이머 및 스케줄러 ID
    let gameTimerId = null;
    let popUpTimeoutId = null;

    // 난이도 기본값
    let popUpInterval = 1500; 

    // DOM 요소를 가져옵니다
    const holes = document.querySelectorAll('.hole');
    const mice = document.querySelectorAll('.mouse');
    const timeDisplay = document.getElementById('time-display');
    const scoreDisplay = document.getElementById('score-display');
    const cheeseDisplay = document.getElementById('cheese-display');
    const startBtn = document.getElementById('start-btn');
    const hallOfFameList = document.getElementById('hall-of-fame');
    const recentRecordsList = document.getElementById('recent-records');

    // 초기화
    renderRecords();

    startBtn.addEventListener('click', startGame);

    mice.forEach(mouse => {
      mouse.addEventListener('mousedown', hitMouse);
    });

    function startGame() {
      if (isGameRunning) return;

      // 게임 상태 리셋
      score = 0;
      cheeseCount = 5;
      timeRemaining = 30;
      isGameRunning = true;
      popUpInterval = 1500;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeRemaining;
      updateCheeseUI();

      startBtn.disabled = true;

      // 타이머 시작 (1초마다)
      gameTimerId = setInterval(() => {
        timeRemaining--;
        timeDisplay.textContent = timeRemaining;

        adjustDifficulty();

        if (timeRemaining <= 0) {
          endGame(true); // 성공으로 완료
        }
      }, 1000);

      // 첫 쥐 팝업 시작
      scheduleNextMouse();
    }

    // 난이도 단계별 출현 간격(popUpInterval) 조절
    function adjustDifficulty() {
      const elapsed = 30 - timeRemaining;

      if (elapsed >= 20) {
        popUpInterval = 1000; // 3단계: 1초 간격
      } else if (elapsed >= 10) {
        popUpInterval = 1300; // 2단계: 1.3초 간격
      } else {
        popUpInterval = 1500; // 1단계: 1.5초 간격
      }
    }

    function getRandomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) {
        return getRandomHole();
      }
      lastHole = hole;
      return hole;
    }

    function popUpMouse() {
      if (!isGameRunning) return;

      const hole = getRandomHole();
      const mouse = hole.querySelector('.mouse');
      isHit = false;

      // --- [확률 기반 머무르는 시간(stayDuration) 계산] ---
      let currentStayDuration = 1200;
      const elapsed = 30 - timeRemaining;

      if (elapsed >= 20) {
        // 3단계 (20~30초): 40% 확률로 0.45초, 60% 확률로 0.65초
        currentStayDuration = (Math.random() < 0.4) ? 450 : 650;
      } else if (elapsed >= 10) {
        // 2단계 (10~20초): 25% 확률로 0.65초, 75% 확률로 0.9초
        currentStayDuration = (Math.random() < 0.25) ? 650 : 900;
      } else {
        // 1단계 (0~10초): 고정 1.2초
        currentStayDuration = 1200;
      }

      mouse.dataset.clickable = "true";
      mouse.style.backgroundImage = "url('mouse_popup.png')";
      mouse.classList.add('up');

      // 머무르는 시간 종료 처리
      setTimeout(() => {
        if (mouse.classList.contains('up')) {
          mouse.classList.remove('up');
          mouse.dataset.clickable = "false";

          // 맞추지 못하고 올라왔다 내려갔을 때 처리
          if (!isHit && isGameRunning) {
            cheeseCount--;
            updateCheeseUI();

            if (cheeseCount <= 0) {
              endGame(false); // 치즈 소진으로 실패
              return;
            }
          }
        }
      }, currentStayDuration);

      scheduleNextMouse();
    }

    function scheduleNextMouse() {
      if (!isGameRunning) return;
      popUpTimeoutId = setTimeout(() => {
        popUpMouse();
      }, popUpInterval);
    }

    function hitMouse(e) {
      if (!isGameRunning) return;
      const mouse = e.target;

      if (mouse.dataset.clickable === "true") {
        isHit = true;
        score++;
        scoreDisplay.textContent = score;

        mouse.dataset.clickable = "false";
        mouse.style.backgroundImage = "url('mouse_hit.png')";

        setTimeout(() => {
          mouse.classList.remove('up');
        }, 200);
      }
    }

    function updateCheeseUI() {
      let cheeseStr = '';
      for (let i = 0; i < cheeseCount; i++) {
        cheeseStr += '🧀';
      }
      cheeseDisplay.textContent = cheeseStr || '없음';
    }

    function endGame(isSuccess) {
      isGameRunning = false;
      clearInterval(gameTimerId);
      clearTimeout(popUpTimeoutId);

      // 올라와 있는 모든 쥐 내리기
      mice.forEach(m => m.classList.remove('up'));

      startBtn.disabled = false;

      // 결과 메시지 및 기록 저장
      if (isSuccess) {
        alert(`🎉 축하합니다! 치즈를 성공적으로 지켰습니다!\n잡은 쥐: ${score}마리`);
      } else {
        alert(`💥 치즈를 모두 빼앗겼습니다! 게임 오버!\n잡은 쥐: ${score}마리`);
      }

      saveRecord(score, isSuccess);
      renderRecords();
    }

    // localStorage 기록 저장 로직
    function saveRecord(score, isSuccess) {
      const now = new Date();
      const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      const newRecord = {
        score: score,
        isSuccess: isSuccess,
        date: timeStr
      };

      // 1. 최근 기록 저장 (최대 5개)
      let recent = JSON.parse(localStorage.getItem('cheese_recent')) || [];
      recent.unshift(newRecord);
      if (recent.length > 5) recent.pop();
      localStorage.setItem('cheese_recent', JSON.stringify(recent));

      // 2. 명예의 전당 저장 (성공한 기록 중 TOP 3)
      if (isSuccess) {
        let hof = JSON.parse(localStorage.getItem('cheese_hof')) || [];
        hof.push(newRecord);
        hof.sort((a, b) => b.score - a.score);
        hof = hof.slice(0, 3);
        localStorage.setItem('cheese_hof', JSON.stringify(hof));
      }
    }

    // 기록 화면 렌더링
    function renderRecords() {
      // 명예의 전당 출력
      const hof = JSON.parse(localStorage.getItem('cheese_hof')) || [];
      hallOfFameList.innerHTML = '';
      if (hof.length === 0) {
        hallOfFameList.innerHTML = '<li>기록 없음</li>';
      } else {
        hof.forEach((item, idx) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${idx + 1}위: ${item.score}마리</span> <small>${item.date}</small>`;
          hallOfFameList.appendChild(li);
        });
      }

      // 최근 기록 출력
      const recent = JSON.parse(localStorage.getItem('cheese_recent')) || [];
      recentRecordsList.innerHTML = '';
      if (recent.length === 0) {
        recentRecordsList.innerHTML = '<li>기록 없음</li>';
      } else {
        recent.forEach(item => {
          const li = document.createElement('li');
          const resultText = item.isSuccess ? '성공' : '실패';
          li.innerHTML = `<span>${item.score}마리 (${resultText})</span> <small>${item.date}</small>`;
          recentRecordsList.appendChild(li);
        });
      }
    }
  </script>
</body>
</html>
