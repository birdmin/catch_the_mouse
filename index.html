<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치즈를 지켜라! (Catch the Mouse)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #2c3e50;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    h1 {
      margin: 10px 0;
      color: #f1c40f;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .game-container {
      background-color: #34495e;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
    }

    .status-board {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      background-color: #1e2b37;
      padding: 15px 25px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .status-item span {
      color: #e74c3c;
    }
    
    .status-item #cheese-display {
      color: #f1c40f;
    }

    .main-content {
      display: flex;
      gap: 20px;
      width: 100%;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* 게임 판 (3x3 구멍) 및 커서 설정 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 160px);
      grid-template-rows: repeat(3, 160px);
      gap: 15px;
      background-color: #8e44ad;
      padding: 15px;
      border-radius: 10px;
      cursor: url('hammer.png') 15 15, auto;
    }

    .grid:active {
      cursor: url('hammer_hit.png') 15 15, auto;
    }

    .hole {
      position: relative;
      background-color: #4a235a;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: inset 0 10px 10px rgba(0, 0, 0, 0.7);
    }

    .mouse {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 100%;
      background-image: url('mouse_popup.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: top 0.1s ease-out;
    }

    .mouse.up {
      top: 0;
    }

    /* 사이드바 (기록판) */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 260px;
    }

    .record-box {
      background-color: #1e2b37;
      padding: 15px;
      border-radius: 10px;
    }

    .record-box h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #f1c40f;
      border-bottom: 2px solid #34495e;
      padding-bottom: 5px;
      font-size: 1.1rem;
    }

    .record-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.95rem;
    }

    .record-list li {
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #2c3e50;
    }

    .controls {
      margin-top: 20px;
    }

    .btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: #2ecc71;
      transform: translateY(-2px);
    }

    .btn:disabled {
      background-color: #7f8c8d;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <h1>🧀 치즈를 지켜라!</h1>

  <div class="game-container">
    <div class="status-board">
      <div class="status-item">남은 시간: <span id="time-display">30</span>초</div>
      <div class="status-item">잡은 쥐: <span id="score-display">0</span>마리</div>
      <div class="status-item">남은 치즈: <span id="cheese-display">🧀🧀🧀🧀🧀</span></div>
    </div>

    <div class="main-content">
      <!-- 3x3 필드 -->
      <div class="grid" id="game-grid">
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
        <div class="hole"><div class="mouse"></div></div>
      </div>

      <!-- 명예의 전당 및 최근 기록 -->
      <div class="sidebar">
        <div class="record-box">
          <h3>🏆 명예의 전당 (TOP 3)</h3>
          <ol class="record-list" id="hall-of-fame">
            <li>기록 없음</li>
          </ol>
        </div>

        <div class="record-box">
          <h3>🕒 최근 플레이 기록</h3>
          <ul class="record-list" id="recent-records">
            <li>기록 없음</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn">게임 시작</button>
    </div>
  </div>

  <script>
    // --- Web Audio API 기반 효과음 시스템 ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 1. 휘두르기 소리 (Swing)
    function playSwingSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // 2. 명중 타격음 (Hit)
    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // 3. 승리 효과음 (Win)
    function playWinSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // 도, 미, 솔, 높은 도
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    // 4. 패배 효과음 (Game Over)
    function playGameOverSound() {
      if (!audioCtx) return;
      const notes = [400, 350, 300, 220];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.15 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.15);
        osc.stop(audioCtx.currentTime + idx * 0.15 + 0.3);
      });
    }

    // --- 게임 상태 및 로직 변수 ---
    let score = 0;
    let cheeseCount = 5;
    let timeRemaining = 30;
    let isGameRunning = false;
    let lastHole = null;
    let isHit = false;

    let gameTimerId = null;
    let popUpTimeoutId = null;
    let popUpInterval = 1500; 

    // DOM 요소
    const holes = document.querySelectorAll('.hole');
    const mice = document.querySelectorAll('.mouse');
    const grid = document.getElementById('game-grid');
    const timeDisplay = document.getElementById('time-display');
    const scoreDisplay = document.getElementById('score-display');
    const cheeseDisplay = document.getElementById('cheese-display');
    const startBtn = document.getElementById('start-btn');
    const hallOfFameList = document.getElementById('hall-of-fame');
    const recentRecordsList = document.getElementById('recent-records');

    // 초기화
    renderRecords();

    // 격자 판 클릭 시 휘두르기 효과음 재생
    grid.addEventListener('mousedown', () => {
      if (isGameRunning) {
        initAudio();
        playSwingSound();
      }
    });

    startBtn.addEventListener('click', startGame);

    mice.forEach(mouse => {
      mouse.addEventListener('mousedown', hitMouse);
    });

    function startGame() {
      initAudio();
      if (isGameRunning) return;

      score = 0;
      cheeseCount = 5;
      timeRemaining = 30;
      isGameRunning = true;
      popUpInterval = 1500;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeRemaining;
      updateCheeseUI();

      startBtn.disabled = true;

      gameTimerId = setInterval(() => {
        timeRemaining--;
        timeDisplay.textContent = timeRemaining;

        adjustDifficulty();

        if (timeRemaining <= 0) {
          endGame(true);
        }
      }, 1000);

      scheduleNextMouse();
    }

    function adjustDifficulty() {
      const elapsed = 30 - timeRemaining;

      if (elapsed >= 20) {
        popUpInterval = 1000;
      } else if (elapsed >= 10) {
        popUpInterval = 1300;
      } else {
        popUpInterval = 1500;
      }
    }

    function getRandomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      const hole = holes[idx];
      if (hole === lastHole) {
        return getRandomHole();
      }
      lastHole = hole;
      return hole;
    }

    function popUpMouse() {
      if (!isGameRunning) return;

      const hole = getRandomHole();
      const mouse = hole.querySelector('.mouse');
      isHit = false;

      let currentStayDuration = 1200;
      const elapsed = 30 - timeRemaining;

      if (elapsed >= 20) {
        const rand = Math.random();
        if (rand < 0.1) {
          currentStayDuration = 300;
        } else if (rand < 0.4) {
          currentStayDuration = 450;
        } else {
          currentStayDuration = 650;
        }
      } else if (elapsed >= 10) {
        currentStayDuration = (Math.random() < 0.25) ? 650 : 900;
      } else {
        currentStayDuration = 1200;
      }

      mouse.dataset.clickable = "true";
      mouse.style.backgroundImage = "url('mouse_popup.png')";
      mouse.classList.add('up');

      setTimeout(() => {
        if (mouse.classList.contains('up')) {
          mouse.classList.remove('up');
          mouse.dataset.clickable = "false";

          if (!isHit && isGameRunning) {
            cheeseCount--;
            updateCheeseUI();

            if (cheeseCount <= 0) {
              endGame(false);
              return;
            }
          }
        }
      }, currentStayDuration);

      scheduleNextMouse();
    }

    function scheduleNextMouse() {
      if (!isGameRunning) return;
      popUpTimeoutId = setTimeout(() => {
        popUpMouse();
      }, popUpInterval);
    }

    function hitMouse(e) {
      if (!isGameRunning) return;
      e.stopPropagation(); // 휘두르기 소리 중복 방지

      const mouse = e.target;

      if (mouse.dataset.clickable === "true") {
        isHit = true;
        playHitSound(); // 명중 타격음 재생

        score++;
        scoreDisplay.textContent = score;

        mouse.dataset.clickable = "false";
        mouse.style.backgroundImage = "url('mouse_hit.png')";

        setTimeout(() => {
          mouse.classList.remove('up');
        }, 200);
      } else {
        playSwingSound(); // 허공 타격 시 Swing 사운드
      }
    }

    function updateCheeseUI() {
      let cheeseStr = '';
      for (let i = 0; i < cheeseCount; i++) {
        cheeseStr += '🧀';
      }
      cheeseDisplay.textContent = cheeseStr || '없음';
    }

    function endGame(isSuccess) {
      isGameRunning = false;
      clearInterval(gameTimerId);
      clearTimeout(popUpTimeoutId);

      mice.forEach(m => m.classList.remove('up'));
      startBtn.disabled = false;

      if (isSuccess) {
        playWinSound();
        setTimeout(() => {
          alert(`🎉 축하합니다! 치즈를 성공적으로 지켰습니다!\n잡은 쥐: ${score}마리`);
        }, 200);
      } else {
        playGameOverSound();
        setTimeout(() => {
          alert(`💥 치즈를 모두 빼앗겼습니다! 게임 오버!\n잡은 쥐: ${score}마리`);
        }, 200);
      }

      saveRecord(score, isSuccess);
      renderRecords();
    }

    function saveRecord(score, isSuccess) {
      const now = new Date();
      const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      const newRecord = {
        score: score,
        isSuccess: isSuccess,
        date: timeStr
      };

      let recent = JSON.parse(localStorage.getItem('cheese_recent')) || [];
      recent.unshift(newRecord);
      if (recent.length > 5) recent.pop();
      localStorage.setItem('cheese_recent', JSON.stringify(recent));

      if (isSuccess) {
        let hof = JSON.parse(localStorage.getItem('cheese_hof')) || [];
        hof.push(newRecord);
        hof.sort((a, b) => b.score - a.score);
        hof = hof.slice(0, 3);
        localStorage.setItem('cheese_hof', JSON.stringify(hof));
      }
    }

    function renderRecords() {
      const hof = JSON.parse(localStorage.getItem('cheese_hof')) || [];
      hallOfFameList.innerHTML = '';
      if (hof.length === 0) {
        hallOfFameList.innerHTML = '<li>기록 없음</li>';
      } else {
        hof.forEach((item, idx) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${idx + 1}위: ${item.score}마리</span> <small>${item.date}</small>`;
          hallOfFameList.appendChild(li);
        });
      }

      const recent = JSON.parse(localStorage.getItem('cheese_recent')) || [];
      recentRecordsList.innerHTML = '';
      if (recent.length === 0) {
        recentRecordsList.innerHTML = '<li>기록 없음</li>';
      } else {
        recent.forEach(item => {
          const li = document.createElement('li');
          const resultText = item.isSuccess ? '성공' : '실패';
          li.innerHTML = `<span>${item.score}마리 (${resultText})</span> <small>${item.date}</small>`;
          recentRecordsList.appendChild(li);
        });
      }
    }
  </script>
</body>
</html>
