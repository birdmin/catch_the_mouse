<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치즈를 지켜라! - 쥐 잡기 게임</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Pretendard', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 게임 화면과 기록 패널 배치 */
    #main-wrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 540px;
      background: url('background.png') no-repeat center/cover;
      border: 4px solid #444;
      border-radius: 12px;
      overflow: hidden;
      cursor: none;
    }

    /* 우측 통합 기록 패널 */
    #side-panel {
      width: 260px;
      height: 540px;
      background: #2a2a2a;
      border: 4px solid #444;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-section-title {
      font-size: 15px;
      color: #ffda79;
      text-align: center;
      margin: 0 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #444;
    }

    /* 상단 TOP 3 영역 */
    #top3-section {
      flex-shrink: 0;
    }

    #top3-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }

    #top3-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      border: 1px solid rgba(255, 218, 121, 0.2);
    }

    #top3-list li:nth-child(1) { color: #ffd700; border-color: #ffd700; font-weight: bold; }
    #top3-list li:nth-child(2) { color: #c0c0c0; }
    #top3-list li:nth-child(3) { color: #cd7f32; }

    /* 하단 최근 기록 20개 영역 */
    #recent-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #recent-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
      overflow-y: auto;
      flex: 1;
    }

    #recent-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    #recent-list li span.date {
      color: #888;
      font-size: 11px;
    }

    #hammer {
      position: absolute;
      width: 80px;
      height: 80px;
      background: url('hammer.png?v=1') no-repeat center/contain;
      pointer-events: none;
      z-index: 100;
      transform-origin: 80% 80%;
      transition: transform 0.04s ease-out;
      display: none;
    }

    #hammer.hit {
      transform: rotate(-45deg);
    }

    #ui-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .info-box {
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cheese-icon {
      width: 22px;
      height: 22px;
    }

    #game-rule {
      font-size: 13px;
      color: #ffda79;
    }

    .audio-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid #ffda79;
      color: #ffda79;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .grid-container {
      position: absolute;
      top: 130px;
      left: 100px;
      width: 600px;
      height: 350px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
    }

    .hole {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      background: transparent;
    }

    .mouse {
      position: absolute;
      bottom: -100%;
      width: 110px;
      height: 110px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: bottom 0.15s ease-out;
      cursor: none;
    }

    .mouse.up {
      bottom: 10px;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      cursor: auto;
    }

    .overlay h1 {
      font-size: 36px;
      margin-bottom: 12px;
      color: #ffda79;
    }

    .overlay p {
      font-size: 18px;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #1a1a1a;
      background-color: #ffda79;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-secondary {
      background-color: #555555;
      color: #ffffff;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div id="main-wrapper">
    <!-- 메인 게임 영역 -->
    <div id="game-container">
      <div id="hammer"></div>

      <div id="ui-bar">
        <div>
          <div id="game-rule">🎮 쥐를 클릭해 치즈를 지키세요!</div>
          <div class="info-box">남은 시간: <span id="time-display">30</span>초</div>
        </div>
        <div class="info-box">
          점수: <span id="score-display">0</span>
        </div>
        <div class="info-box">
          치즈: <span id="cheese-container"></span>
          <button id="bgm-btn" class="audio-btn">🎵 BGM ON</button>
          <button id="sfx-btn" class="audio-btn">🔊 SFX ON</button>
        </div>
      </div>

      <div class="grid-container">
        <div class="hole" data-index="0"><div class="mouse"></div></div>
        <div class="hole" data-index="1"><div class="mouse"></div></div>
        <div class="hole" data-index="2"><div class="mouse"></div></div>
        <div class="hole" data-index="3"><div class="mouse"></div></div>
        <div class="hole" data-index="4"><div class="mouse"></div></div>
        <div class="hole" data-index="5"><div class="mouse"></div></div>
        <div class="hole" data-index="6"><div class="mouse"></div></div>
        <div class="hole" data-index="7"><div class="mouse"></div></div>
        <div class="hole" data-index="8"><div class="mouse"></div></div>
      </div>

      <!-- 안내 및 시작/결과 화면 -->
      <div id="overlay-screen" class="overlay">
        <h1 id="overlay-title">🧀 치즈를 지켜라!</h1>
        <p id="overlay-desc">30초 동안 쥐들이 치즈를 훔쳐가지 못하게 잡으세요.<br>치즈 3개를 모두 빼앗기지 않고 지켜내야 합니다!</p>

        <div class="btn-group">
          <button id="start-btn" class="btn">게임 시작</button>
          <button id="home-btn" class="btn btn-secondary hidden">처음으로</button>
        </div>
      </div>
    </div>

    <!-- 우측 기록 패널 (상단 TOP3, 하단 최근 20개) -->
    <div id="side-panel">
      <div id="top3-section">
        <h2 class="panel-section-title">🏆 TOP 3 기록</h2>
        <ul id="top3-list">
          <li><span>기록 없음</span><span>-</span></li>
        </ul>
      </div>

      <div id="recent-section">
        <h2 class="panel-section-title">📋 최근 기록 (최대 20개)</h2>
        <ul id="recent-list">
          <li><span>기록 없음</span></li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // --- Audio 객체 및 사운드 제어 ---
    const bgmAudio = document.getElementById('bgm');
    const bgmBtn = document.getElementById('bgm-btn');
    const sfxBtn = document.getElementById('sfx-btn');

    let isBgmMuted = false;
    let isSfxMuted = false;

    bgmAudio.volume = 0.3;

    bgmBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isBgmMuted = !isBgmMuted;
      if (isBgmMuted) {
        bgmAudio.pause();
        bgmBtn.textContent = '🔇 BGM OFF';
      } else {
        if (isGameRunning) bgmAudio.play();
        bgmBtn.textContent = '🎵 BGM ON';
      }
    });

    sfxBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isSfxMuted = !isSfxMuted;
      sfxBtn.textContent = isSfxMuted ? '🔇 SFX OFF' : '🔊 SFX ON';
    });

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSwingSound() {
      if (!audioCtx || isSfxMuted) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playHitSound() {
      if (!audioCtx || isSfxMuted) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playWinSound() {
      if (!audioCtx || isSfxMuted) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    function playGameOverSound() {
      if (!audioCtx || isSfxMuted) return;
      const notes = [400, 350, 300, 220];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.15 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.15);
        osc.stop(audioCtx.currentTime + idx * 0.15 + 0.3);
      });
    }

    // --- LocalStorage 점수 데이터 관리 (호환성 보장) ---
    function getTopScores() {
      const scores = localStorage.getItem('cheeseGameTopScores') || localStorage.getItem('cheeseGameScores');
      return scores ? JSON.parse(scores) : [];
    }

    function getRecentScores() {
      const scores = localStorage.getItem('cheeseGameRecentScores');
      return scores ? JSON.parse(scores) : [];
    }

    function saveScoreData(newScore) {
      const now = new Date();
      const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
      const timeStr = `${dateStr} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      // 1. TOP 3 업데이트
      if (newScore > 0) {
        const topScores = getTopScores();
        topScores.push({ score: newScore, date: dateStr });
        topScores.sort((a, b) => b.score - a.score);
        localStorage.setItem('cheeseGameTopScores', JSON.stringify(topScores.slice(0, 3)));
      }

      // 2. 최근 20개 업데이트
      const recentScores = getRecentScores();
      recentScores.unshift({ score: newScore, time: timeStr });
      localStorage.setItem('cheeseGameRecentScores', JSON.stringify(recentScores.slice(0, 20)));
    }

    function renderPanels() {
      // TOP 3 렌더링
      const topListEl = document.getElementById('top3-list');
      const topScores = getTopScores();
      topListEl.innerHTML = '';

      if (topScores.length === 0) {
        topListEl.innerHTML = '<li><span>기록 없음</span><span>-</span></li>';
      } else {
        topScores.forEach((item, index) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${index + 1}위 (${item.date || '날짜 없음'})</span><b>${item.score}점</b>`;
          topListEl.appendChild(li);
        });
      }

      // 최근 기록 20개 렌더링
      const recentListEl = document.getElementById('recent-list');
      const recentScores = getRecentScores();
      recentListEl.innerHTML = '';

      if (recentScores.length === 0) {
        recentListEl.innerHTML = '<li><span>기록 없음</span></li>';
      } else {
        recentScores.forEach((item) => {
          const li = document.createElement('li');
          li.innerHTML = `<span class="date">${item.time}</span><b>${item.score}점</b>`;
          recentListEl.appendChild(li);
        });
      }
    }

    // --- 게임 상태 변수 ---
    let score = 0;
    let timeRemaining = 30;
    let cheeseCount = 3;
    let gameTimeout = null;
    let timerInterval = null;
    let isHit = false;
    let isGameRunning = false;

    const gameContainer = document.getElementById('game-container');
    const hammer = document.getElementById('hammer');
    const scoreDisplay = document.getElementById('score-display');
    const timeDisplay = document.getElementById('time-display');
    const cheeseContainer = document.getElementById('cheese-container');
    const overlayScreen = document.getElementById('overlay-screen');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');
    const homeBtn = document.getElementById('home-btn');
    const holes = document.querySelectorAll('.hole');

    gameContainer.addEventListener('mousemove', (e) => {
      const rect = gameContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      hammer.style.left = `${x - 40}px`;
      hammer.style.top = `${y - 40}px`;
      hammer.style.display = 'block';
    });

    gameContainer.addEventListener('mouseenter', () => {
      hammer.style.display = 'block';
    });

    gameContainer.addEventListener('mouseleave', () => {
      hammer.style.display = 'none';
    });

    window.addEventListener('mousedown', () => {
      initAudio();

      hammer.classList.remove('hit');
      void hammer.offsetWidth; 
      hammer.classList.add('hit');

      if (isGameRunning) {
        playSwingSound();
      }
    });

    window.addEventListener('mouseup', () => {
      hammer.classList.remove('hit');
    });

    function updateCheeseUI() {
      cheeseContainer.innerHTML = '';
      for (let i = 0; i < cheeseCount; i++) {
        const img = document.createElement('img');
        img.src = 'cheese.png';
        img.className = 'cheese-icon';
        cheeseContainer.appendChild(img);
      }
    }

    function resetGame() {
      score = 0;
      timeRemaining = 30;
      cheeseCount = 3;
      isGameRunning = true;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeRemaining;
      updateCheeseUI();

      holes.forEach(hole => {
        const mouse = hole.querySelector('.mouse');
        mouse.classList.remove('up');
        mouse.dataset.clickable = "false";
        mouse.dataset.isFast = "false";
        mouse.style.backgroundImage = '';
      });
    }

    function getRandomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      return holes[idx];
    }

    function popUpMouse() {
      if (!isGameRunning) return;

      const hole = getRandomHole();
      const mouse = hole.querySelector('.mouse');
      isHit = false;

      // 10% 확률로 빠른 보너스 쥐 출현 (0.3초 노출)
      const isFast = Math.random() < 0.10;
      const stayDuration = isFast ? 300 : 1000;

      mouse.dataset.isFast = isFast ? "true" : "false";
      mouse.dataset.clickable = "true";
      mouse.style.backgroundImage = isFast ? "url('fast_mouse_popup.png')" : "url('mouse_popup.png')";
      mouse.classList.add('up');

      setTimeout(() => {
        if (mouse.classList.contains('up')) {
          mouse.classList.remove('up');
          mouse.dataset.clickable = "false";

          if (!isHit && isGameRunning) {
            cheeseCount--;
            updateCheeseUI();

            if (cheeseCount <= 0) {
              endGame(false);
              return;
            }
          }
        }
      }, stayDuration);

      if (isGameRunning) {
        gameTimeout = setTimeout(popUpMouse, 1200);
      }
    }

    holes.forEach(hole => {
      const mouse = hole.querySelector('.mouse');
      mouse.addEventListener('mousedown', (e) => {
        if (!isGameRunning || isHit || mouse.dataset.clickable !== "true") return;

        isHit = true;
        mouse.dataset.clickable = "false";

        playHitSound();

        // 쥐 잡기 동일 100점
        score += 100;
        scoreDisplay.textContent = score;

        const isFast = mouse.dataset.isFast === "true";
        mouse.style.backgroundImage = isFast ? "url('fast_mouse_hit.png')" : "url('mouse_hit.png')";

        setTimeout(() => {
          mouse.classList.remove('up');
        }, 200);
      });
    });

    function startGame() {
      initAudio();

      if (!isBgmMuted) {
        bgmAudio.currentTime = 0;
        bgmAudio.play().catch(e => console.log("BGM 자동 재생 차단됨:", e));
      }

      resetGame();
      overlayScreen.classList.add('hidden');

      timerInterval = setInterval(() => {
        timeRemaining--;
        timeDisplay.textContent = timeRemaining;

        if (timeRemaining <= 0) {
          endGame(true);
        }
      }, 1000);

      popUpMouse();
    }

    function endGame(isSuccess) {
      isGameRunning = false;
      clearTimeout(gameTimeout);
      clearInterval(timerInterval);

      bgmAudio.pause();

      overlayScreen.classList.remove('hidden');
      homeBtn.classList.remove('hidden');

      if (isSuccess && cheeseCount > 0) {
        playWinSound();
        overlayTitle.textContent = "🎉 성공! 치즈를 지켜냈습니다!";
        overlayDesc.innerHTML = `최종 점수: <b>${score}점</b>`;
        startBtn.textContent = "다시 시작";
      } else {
        playGameOverSound();
        overlayTitle.textContent = "💥 실패! 치즈를 모두 빼앗겼습니다.";
        overlayDesc.innerHTML = `최종 점수: <b>${score}점</b><br>30초 동안 치즈를 지키지 못했습니다.`;
        startBtn.textContent = "다시 시작";
      }

      saveScoreData(score);
      renderPanels();
    }

    function goHome() {
      overlayTitle.textContent = "🧀 치즈를 지켜라!";
      overlayDesc.innerHTML = "30초 동안 쥐들이 치즈를 훔쳐가지 못하게 잡으세요.<br>치즈 3개를 모두 빼앗기지 않고 지켜내야 합니다!";
      startBtn.textContent = "게임 시작";
      homeBtn.classList.add('hidden');
      resetGame();
      isGameRunning = false;
      bgmAudio.pause();
      renderPanels();
    }

    startBtn.addEventListener('click', startGame);
    homeBtn.addEventListener('click', goHome);

    updateCheeseUI();
    renderPanels();
  </script>
</body>
</html>
