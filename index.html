<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치즈를 지켜라! - 쥐 잡기 게임</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Pretendard', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #main-wrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      max-width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* 사용자 배경 이미지 삽입 */
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      background: url('background.png') no-repeat center/cover;
      border: 4px solid #444;
      border-radius: 12px;
      overflow: hidden;
      cursor: none;
      flex-shrink: 0;
    }

    /* 마우스 커서 망치 */
    #hammer {
      position: absolute;
      width: 80px;
      height: 80px;
      background: url('hammer.png?v=1') no-repeat center/contain;
      pointer-events: none;
      z-index: 100;
      transform-origin: 80% 80%;
      transition: transform 0.05s ease-out;
      display: none;
    }

    #hammer.hit {
      transform: rotate(-45deg);
    }

    #score-board {
      width: 320px;
      height: 540px;
      background: #2a2a2a;
      border: 4px solid #444;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .board-section {
      display: flex;
      flex-direction: column;
    }

    .board-section.recent {
      flex-grow: 1;
      overflow: hidden;
    }

    #score-board h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #ffda79;
      border-bottom: 2px solid #444;
      padding-bottom: 4px;
    }

    .record-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
    }

    .record-list li {
      background: #333;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.3;
    }

    .top-list li {
      background: #3a3218;
      border: 1px solid #ffda79;
    }

    .bonus-text {
      font-size: 11px;
      color: #ffda79;
    }

    #ui-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .info-box {
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cheese-icon {
      width: 24px;
      height: 24px;
    }

    #game-rule {
      font-size: 14px;
      color: #ffda79;
    }

    #speed-indicator {
      font-size: 12px;
      color: #ff5252;
      margin-left: 8px;
      font-weight: bold;
    }

    .grid-container {
      position: absolute;
      top: 140px;
      left: 180px;
      width: 600px;
      height: 340px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
    }

    .hole {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      background: transparent;
    }

    .mouse {
      position: absolute;
      bottom: -100%;
      width: 110px;
      height: 110px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: bottom 0.15s ease-out;
      cursor: none;
    }

    .mouse.up {
      bottom: 10px;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      cursor: auto;
    }

    .overlay h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #ffda79;
    }

    .overlay p {
      font-size: 18px;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #1a1a1a;
      background-color: #ffda79;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-secondary {
      background-color: #a0a0a0;
      color: #ffffff;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="main-wrapper">
    <div id="game-container">
      <div id="hammer"></div>

      <div id="ui-bar">
        <div>
          <div id="game-rule">🎮 쥐를 클릭해 치즈를 지키세요! <span id="speed-indicator">단계: 1단계 (보통)</span></div>
          <div class="info-box">남은 시간: <span id="time-display">30</span>초</div>
        </div>
        <div class="info-box">
          점수: <span id="score-display">0</span>
        </div>
        <div class="info-box">
          치즈: <span id="cheese-container"></span>
        </div>
      </div>

      <div class="grid-container">
        <div class="hole" data-index="0"><div class="mouse"></div></div>
        <div class="hole" data-index="1"><div class="mouse"></div></div>
        <div class="hole" data-index="2"><div class="mouse"></div></div>
        <div class="hole" data-index="3"><div class="mouse"></div></div>
        <div class="hole" data-index="4"><div class="mouse"></div></div>
        <div class="hole" data-index="5"><div class="mouse"></div></div>
        <div class="hole" data-index="6"><div class="mouse"></div></div>
        <div class="hole" data-index="7"><div class="mouse"></div></div>
        <div class="hole" data-index="8"><div class="mouse"></div></div>
      </div>

      <div id="overlay-screen" class="overlay">
        <h1 id="overlay-title">🧀 치즈를 지켜라!</h1>
        <p id="overlay-desc">30초 동안 쥐들이 치즈를 훔쳐가지 못하게 잡으세요.<br>치즈 3개를 모두 빼앗기지 않고 지켜내야 합니다!</p>
        <div class="btn-group">
          <button id="start-btn" class="btn">게임 시작</button>
          <button id="home-btn" class="btn btn-secondary hidden">처음으로</button>
        </div>
      </div>
    </div>

    <div id="score-board">
      <div class="board-section">
        <h2>👑 명예의 전당 (TOP 3)</h2>
        <ul id="top-list" class="record-list top-list">
          <li style="text-align: center; color: #888;">기록 없음</li>
        </ul>
      </div>

      <div class="board-section recent">
        <h2>📜 최근 기록 (최대 20개)</h2>
        <ul id="history-list" class="record-list">
          <li style="text-align: center; color: #888;">기록 없음</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // --- Web Audio API 효과음 로직 ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSwingSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playWinSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    function playGameOverSound() {
      if (!audioCtx) return;
      const notes = [400, 350, 300, 220];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.15 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.15);
        osc.stop(audioCtx.currentTime + idx * 0.15 + 0.3);
      });
    }

    // --- 게임 상태 변수 ---
    let score = 0;
    let timeRemaining = 30;
    let cheeseCount = 3;
    let gameTimeout = null;
    let timerInterval = null;
    let isHit = false;
    let isGameRunning = false;

    let popInterval = 1500;

    let recentRecords = JSON.parse(localStorage.getItem('cheese_game_records')) || [];

    const gameContainer = document.getElementById('game-container');
    const hammer = document.getElementById('hammer');
    const scoreDisplay = document.getElementById('score-display');
    const timeDisplay = document.getElementById('time-display');
    const cheeseContainer = document.getElementById('cheese-container');
    const speedIndicator = document.getElementById('speed-indicator');
    const overlayScreen = document.getElementById('overlay-screen');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');
    const homeBtn = document.getElementById('home-btn');
    const historyList = document.getElementById('history-list');
    const topList = document.getElementById('top-list');
    const holes = document.querySelectorAll('.hole');

    gameContainer.addEventListener('mousemove', (e) => {
      const rect = gameContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      hammer.style.left = `${x - 40}px`;
      hammer.style.top = `${y - 40}px`;
      hammer.style.display = 'block';
    });

    gameContainer.addEventListener('mouseenter', () => {
      hammer.style.display = 'block';
    });

    gameContainer.addEventListener('mouseleave', () => {
      hammer.style.display = 'none';
    });

    // 어디를 누르든 망치가 숙여지고 Swing 소리가 나도록 연동
    gameContainer.addEventListener('mousedown', () => {
      initAudio();
      hammer.classList.add('hit');
      if (isGameRunning) {
        playSwingSound();
      }
    });

    gameContainer.addEventListener('mouseup', () => {
      hammer.classList.remove('hit');
    });

    function updateCheeseUI() {
      cheeseContainer.innerHTML = '';
      for (let i = 0; i < cheeseCount; i++) {
        const img = document.createElement('img');
        img.src = 'cheese.png';
        img.className = 'cheese-icon';
        cheeseContainer.appendChild(img);
      }
    }

    function resetGame() {
      score = 0;
      timeRemaining = 30;
      cheeseCount = 3;
      isGameRunning = true;

      popInterval = 1500;
      speedIndicator.textContent = "단계: 1단계 (보통)";
      speedIndicator.style.color = "#ffda79";

      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeRemaining;
      updateCheeseUI();

      holes.forEach(hole => {
        const mouse = hole.querySelector('.mouse');
        mouse.classList.remove('up');
        mouse.dataset.clickable = "false";
        mouse.style.backgroundImage = '';
      });
    }

    function getRandomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      return holes[idx];
    }

    function adjustDifficulty() {
      const elapsed = 30 - timeRemaining;

      if (elapsed >= 20) {
        popInterval = 1000;
        speedIndicator.textContent = "단계: 3단계 (숙련 🔥)";
        speedIndicator.style.color = "#ff5252";
      } else if (elapsed >= 10) {
        popInterval = 1300;
        speedIndicator.textContent = "단계: 2단계 (빠름 ⚡)";
        speedIndicator.style.color = "#ffbe76";
      }
    }

    function scheduleNextMouse() {
      if (!isGameRunning) return;

      gameTimeout = setTimeout(() => {
        if (isGameRunning) {
          popUpMouse();
        }
      }, popInterval);
    }

    function popUpMouse() {
      const hole = getRandomHole();
      const mouse = hole.querySelector('.mouse');
      isHit = false;

      let currentStayDuration = 1200;
      const elapsed = 30 - timeRemaining;

      if (elapsed >= 20) {
        const rand = Math.random();
        if (rand < 0.1) {
          currentStayDuration = 300; // 0.3초
        } else if (rand < 0.4) {
          currentStayDuration = 450; // 0.45초
        } else {
          currentStayDuration = 650; // 0.65초
        }
      } else if (elapsed >= 10) {
        currentStayDuration = (Math.random() < 0.25) ? 650 : 900;
      } else {
        currentStayDuration = 1200;
      }

      mouse.dataset.clickable = "true";
      mouse.style.backgroundImage = "url('mouse_popup.png')";
      mouse.classList.add('up');

      setTimeout(() => {
        if (mouse.classList.contains('up')) {
          mouse.classList.remove('up');
          mouse.dataset.clickable = "false";

          if (!isHit && isGameRunning) {
            cheeseCount--;
            updateCheeseUI();

            if (cheeseCount <= 0) {
              endGame(false);
              return;
            }
          }
        }
      }, currentStayDuration);

      scheduleNextMouse();
    }

    holes.forEach(hole => {
      const mouse = hole.querySelector('.mouse');
      mouse.addEventListener('mousedown', (e) => {
        e.preventDefault();
        // e.stopPropagation() 제거 -> 이제 쥐를 클릭해도 부모(gameContainer)의 hammer.hit 이벤트를 정상 실행!

        if (!isGameRunning || isHit || mouse.dataset.clickable !== "true") return;

        isHit = true;
        mouse.dataset.clickable = "false";

        playHitSound();

        score += 100;
        scoreDisplay.textContent = score;

        mouse.style.backgroundImage = "url('mouse_hit.png')";

        setTimeout(() => {
          mouse.classList.remove('up');
        }, 200);
      });
    });

    function updateRecordUI() {
      historyList.innerHTML = '';
      if (recentRecords.length === 0) {
        historyList.innerHTML = '<li style="text-align: center; color: #888;">기록 없음</li>';
      } else {
        recentRecords.forEach((rec, idx) => {
          const li = document.createElement('li');
          if (rec.isSuccess) {
            li.innerHTML = `<b>#${recentRecords.length - idx} 성공</b> - ${rec.finalScore}점<br><span class="bonus-text">(치즈 보너스: +${rec.bonusScore}점)</span>`;
          } else {
            li.innerHTML = `<b style="color:#ff5252;">#${recentRecords.length - idx} 실패</b> - 기록 없음`;
          }
          historyList.appendChild(li);
        });
      }

      const successRecords = recentRecords.filter(r => r.isSuccess);
      successRecords.sort((a, b) => b.finalScore - a.finalScore);
      const top3 = successRecords.slice(0, 3);

      topList.innerHTML = '';
      if (top3.length === 0) {
        topList.innerHTML = '<li style="text-align: center; color: #888;">기록 없음</li>';
      } else {
        top3.forEach((rec, idx) => {
          const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉';
          const li = document.createElement('li');
          li.innerHTML = `<b>${medal} ${idx + 1}위</b>: ${rec.finalScore}점 <span class="bonus-text">(+${rec.bonusScore})</span>`;
          topList.appendChild(li);
        });
      }
    }

    function addScoreRecord(finalScore, bonusScore, isSuccess) {
      recentRecords.unshift({ finalScore, bonusScore, isSuccess });
      if (recentRecords.length > 20) recentRecords.pop();

      localStorage.setItem('cheese_game_records', JSON.stringify(recentRecords));

      updateRecordUI();
    }

    function startGame() {
      initAudio();
      resetGame();
      overlayScreen.classList.add('hidden');

      timerInterval = setInterval(() => {
        timeRemaining--;
        timeDisplay.textContent = timeRemaining;
        adjustDifficulty();

        if (timeRemaining <= 0) {
          endGame(true);
        }
      }, 1000);

      scheduleNextMouse();
    }

    function endGame(isSuccess) {
      isGameRunning = false;
      clearTimeout(gameTimeout);
      clearInterval(timerInterval);

      overlayScreen.classList.remove('hidden');
      homeBtn.classList.remove('hidden');

      if (isSuccess && cheeseCount > 0) {
        playWinSound();
        const bonusScore = cheeseCount * 300;
        const finalScore = score + bonusScore;
        overlayTitle.textContent = "🎉 성공! 치즈를 지켜냈습니다!";
        overlayDesc.innerHTML = `획득 점수: ${score}점<br>치즈 보너스(+${bonusScore}점)<br><b>최종 점수: ${finalScore}점</b>`;
        startBtn.textContent = "다시 시작";
        addScoreRecord(finalScore, bonusScore, true);
      } else {
        playGameOverSound();
        overlayTitle.textContent = "💥 실패! 치즈를 모두 빼앗겼습니다.";
        overlayDesc.textContent = "30초 동안 치즈를 지키지 못했습니다. 다시 도전해보세요!";
        startBtn.textContent = "다시 시작";
        addScoreRecord(0, 0, false);
      }
    }

    function goHome() {
      overlayTitle.textContent = "🧀 치즈를 지켜라!";
      overlayDesc.innerHTML = "30초 동안 쥐들이 치즈를 훔쳐가지 못하게 잡으세요.<br>치즈 3개를 모두 빼앗기지 않고 지켜내야 합니다!";
      startBtn.textContent = "게임 시작";
      homeBtn.classList.add('hidden');
      resetGame();
      isGameRunning = false;
    }

    startBtn.addEventListener('click', startGame);
    homeBtn.addEventListener('click', goHome);

    updateCheeseUI();
    updateRecordUI();
  </script>
</body>
</html>
