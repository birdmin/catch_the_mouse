<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치즈를 지켜라! - 쥐 잡기 게임</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Pretendard', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 전체 레이아웃: 게임 화면과 우측 랭킹판 배치 */
    #main-wrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      background: url('background.png') no-repeat center/cover;
      border: 4px solid #444;
      border-radius: 12px;
      overflow: hidden;
      cursor: none;
    }

    #hammer {
      position: absolute;
      width: 80px;
      height: 80px;
      background: url('hammer.png?v=1') no-repeat center/contain;
      pointer-events: none;
      z-index: 100;
      transform-origin: 80% 80%;
      transition: transform 0.04s ease-out;
      display: none;
    }

    #hammer.hit {
      transform: rotate(-45deg);
    }

    #ui-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .info-box {
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cheese-icon {
      width: 24px;
      height: 24px;
    }

    #game-rule {
      font-size: 14px;
      color: #ffda79;
    }

    #speed-indicator {
      font-size: 12px;
      color: #ff5252;
      margin-left: 8px;
      font-weight: bold;
    }

    .audio-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid #ffda79;
      color: #ffda79;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .grid-container {
      position: absolute;
      top: 140px;
      left: 180px;
      width: 600px;
      height: 340px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
    }

    .hole {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      background: transparent;
    }

    .mouse {
      position: absolute;
      bottom: -100%;
      width: 110px;
      height: 110px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: bottom 0.15s ease-out;
      cursor: none;
    }

    .mouse.up {
      bottom: 10px;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      cursor: auto;
    }

    .overlay h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #ffda79;
    }

    .overlay p {
      font-size: 16px;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #1a1a1a;
      background-color: #ffda79;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-secondary {
      background-color: #a0a0a0;
      color: #ffffff;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }

    /* 우측 랭킹 사이드바 스타일 (TOP 3 + 최근 기록 20개) */
    #sidebar-ranking {
      width: 280px;
      height: 540px;
      background: #242424;
      border: 4px solid #444;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rank-section {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px;
    }

    .rank-section h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #ffda79;
      text-align: center;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .top3-list, .recent-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }

    .top3-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 6px;
      margin-bottom: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      font-weight: bold;
    }

    .top3-item:nth-child(1) { color: #ffd700; }
    .top3-item:nth-child(2) { color: #c0c0c0; }
    .top3-item:nth-child(3) { color: #cd7f32; }

    #recent-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .recent-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* 커스텀 스크롤바 */
    .recent-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .recent-scroll::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    .recent-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      font-size: 12px;
      color: #bbb;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <audio id="bgm" src="bgm.mp3" loop></audio>

  <div id="main-wrapper">
    <!-- 게임 본체 컨테이너 -->
    <div id="game-container">
      <div id="hammer"></div>

      <div id="ui-bar">
        <div>
          <div id="game-rule">🎮 쥐를 클릭해 치즈를 지키세요! <span id="speed-indicator">단계: 1단계 (보통)</span></div>
          <div class="info-box">남은 시간: <span id="time-display">30</span>초</div>
        </div>
        <div class="info-box">
          점수: <span id="score-display">0</span>
        </div>
        <div class="info-box">
          치즈: <span id="cheese-container"></span>
          <button id="bgm-btn" class="audio-btn">🎵 BGM ON</button>
          <button id="sfx-btn" class="audio-btn">🔊 SFX ON</button>
        </div>
      </div>

      <div class="grid-container">
        <div class="hole" data-index="0"><div class="mouse"></div></div>
        <div class="hole" data-index="1"><div class="mouse"></div></div>
        <div class="hole" data-index="2"><div class="mouse"></div></div>
        <div class="hole" data-index="3"><div class="mouse"></div></div>
        <div class="hole" data-index="4"><div class="mouse"></div></div>
        <div class="hole" data-index="5"><div class="mouse"></div></div>
        <div class="hole" data-index="6"><div class="mouse"></div></div>
        <div class="hole" data-index="7"><div class="mouse"></div></div>
        <div class="hole" data-index="8"><div class="mouse"></div></div>
      </div>

      <div id="overlay-screen" class="overlay">
        <h1 id="overlay-title">🧀 치즈를 지켜라!</h1>
        <p id="overlay-desc">30초 동안 쥐들이 치즈를 훔쳐가지 못하게 잡으세요.<br>치즈 3개를 모두 빼앗기지 않고 지켜내야 합니다!</p>
        <div class="btn-group">
          <button id="start-btn" class="btn">게임 시작</button>
          <button id="home-btn" class="btn btn-secondary hidden">처음으로</button>
        </div>
      </div>
    </div>

    <!-- 우측 랭킹 사이드바 (위: TOP 3, 아래: 최근 기록 20개) -->
    <div id="sidebar-ranking">
      <div class="rank-section">
        <h3>🏆 TOP 3 랭킹</h3>
        <ul id="top3-list" class="top3-list">
          <li class="top3-item"><span>1위</span><span>0점</span></li>
          <li class="top3-item"><span>2위</span><span>0점</span></li>
          <li class="top3-item"><span>3위</span><span>0점</span></li>
        </ul>
      </div>

      <div id="recent-container" class="rank-section">
        <h3>📜 최근 기록 (최대 20개)</h3>
        <div class="recent-scroll">
          <ul id="recent-list" class="recent-list">
            <li class="recent-item" style="justify-content: center; color: #777;">기록이 없습니다.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const bgmAudio = document.getElementById('bgm');
    const bgmBtn = document.getElementById('bgm-btn');
    const sfxBtn = document.getElementById('sfx-btn');

    let isBgmMuted = false;
    let isSfxMuted = false;

    bgmAudio.volume = 0.3;

    bgmBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isBgmMuted = !isBgmMuted;
      if (isBgmMuted) {
        bgmAudio.pause();
        bgmBtn.textContent = '🔇 BGM OFF';
      } else {
        if (isGameRunning) bgmAudio.play();
        bgmBtn.textContent = '🎵 BGM ON';
      }
    });

    sfxBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isSfxMuted = !isSfxMuted;
      sfxBtn.textContent = isSfxMuted ? '🔇 SFX OFF' : '🔊 SFX ON';
    });

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSwingSound() {
      if (!audioCtx || isSfxMuted) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playHitSound() {
      if (!audioCtx || isSfxMuted) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playWinSound() {
      if (!audioCtx || isSfxMuted) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
      });
    }

    function playGameOverSound() {
      if (!audioCtx || isSfxMuted) return;
      const notes = [400, 350, 300, 220];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.15 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.15);
        osc.stop(audioCtx.currentTime + idx * 0.15 + 0.3);
      });
    }

    let score = 0;
    let timeRemaining = 30;
    let cheeseCount = 3;
    let gameTimeout = null;
    let activeMouseTimeouts = [];
    let timerInterval = null;
    let isGameRunning = false;
    let popInterval = 1500;

    // 로컬 스토리지 연동 (TOP 3 및 최근 기록 20개 관리)
    let topScores = JSON.parse(localStorage.getItem('cheese_top3')) || [0, 0, 0];
    let recentScores = JSON.parse(localStorage.getItem('cheese_recent20')) || [];

    const gameContainer = document.getElementById('game-container');
    const hammer = document.getElementById('hammer');
    const scoreDisplay = document.getElementById('score-display');
    const timeDisplay = document.getElementById('time-display');
    const cheeseContainer = document.getElementById('cheese-container');
    const speedIndicator = document.getElementById('speed-indicator');
    const overlayScreen = document.getElementById('overlay-screen');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const top3List = document.getElementById('top3-list');
    const recentList = document.getElementById('recent-list');
    const startBtn = document.getElementById('start-btn');
    const homeBtn = document.getElementById('home-btn');
    const holes = document.querySelectorAll('.hole');

    function updateSidebarUI() {
      // TOP 3 업데이트
      top3List.innerHTML = '';
      topScores.forEach((rkScore, idx) => {
        const li = document.createElement('li');
        li.className = 'top3-item';
        li.innerHTML = `<span>${idx + 1}위</span><span>${rkScore}점</span>`;
        top3List.appendChild(li);
      });

      // 최근 기록 20개 업데이트
      recentList.innerHTML = '';
      if (recentScores.length === 0) {
        const li = document.createElement('li');
        li.className = 'recent-item';
        li.style.justifyContent = 'center';
        li.style.color = '#777';
        li.textContent = '기록이 없습니다.';
        recentList.appendChild(li);
      } else {
        recentScores.forEach((rec, idx) => {
          const li = document.createElement('li');
          li.className = 'recent-item';
          li.innerHTML = `<span>#${idx + 1}</span><span>${rec}점</span>`;
          recentList.appendChild(li);
        });
      }
    }

    updateSidebarUI();

    gameContainer.addEventListener('mousemove', (e) => {
      const rect = gameContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      hammer.style.left = `${x - 40}px`;
      hammer.style.top = `${y - 40}px`;
      hammer.style.display = 'block';
    });

    gameContainer.addEventListener('mouseenter', () => {
      hammer.style.display = 'block';
    });

    gameContainer.addEventListener('mouseleave', () => {
      hammer.style.display = 'none';
    });

    window.addEventListener('mousedown', () => {
      initAudio();
      
      hammer.classList.remove('hit');
      void hammer.offsetWidth; 
      hammer.classList.add('hit');

      if (isGameRunning) {
        playSwingSound();
      }
    });

    window.addEventListener('mouseup', () => {
      hammer.classList.remove('hit');
    });

    function updateCheeseUI() {
      cheeseContainer.innerHTML = '';
      for (let i = 0; i < cheeseCount; i++) {
        const img = document.createElement('img');
        img.src = 'cheese.png';
        img.className = 'cheese-icon';
        cheeseContainer.appendChild(img);
      }
    }

    function clearAllTimers() {
      clearTimeout(gameTimeout);
      gameTimeout = null;
      activeMouseTimeouts.forEach(t => clearTimeout(t));
      activeMouseTimeouts = [];
    }

    function resetGame() {
      clearAllTimers();
      score = 0;
      timeRemaining = 30;
      cheeseCount = 3;
      isGameRunning = true;

      popInterval = 1500;
      speedIndicator.textContent = "단계: 1단계 (보통)";
      speedIndicator.style.color = "#ffda79";

      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeRemaining;
      updateCheeseUI();

      holes.forEach(hole => {
        const mouse = hole.querySelector('.mouse');
        mouse.classList.remove('up');
        mouse.dataset.clickable = "false";
        mouse.dataset.hitProcessed = "false";
        mouse.style.backgroundImage = '';
      });
    }

    function getRandomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      return holes[idx];
    }

    function adjustDifficulty() {
      const elapsed = 30 - timeRemaining;

      if (elapsed >= 20) {
        popInterval = 1000;
        speedIndicator.textContent = "단계: 3단계 (숙련 🔥)";
        speedIndicator.style.color = "#ff5252";
      } else if (elapsed >= 10) {
        popInterval = 1300;
        speedIndicator.textContent = "단계: 2단계 (빠름 ⚡)";
        speedIndicator.style.color = "#ffbe76";
      }
    }

    function scheduleNextMouse() {
      if (!isGameRunning) return;

      gameTimeout = setTimeout(() => {
        if (isGameRunning) {
          popUpMouse();
        }
      }, popInterval);
    }

    function popUpMouse() {
      if (!isGameRunning) return;

      const hole = getRandomHole();
      const mouse = hole.querySelector('.mouse');
      
      if (mouse.classList.contains('up')) {
        scheduleNextMouse();
        return;
      }

      let currentStayDuration = 1200;
      const elapsed = 30 - timeRemaining;

      if (elapsed >= 20) {
        const rand = Math.random();
        if (rand < 0.1) {
          currentStayDuration = 300;
        } else if (rand < 0.4) {
          currentStayDuration = 450;
        } else {
          currentStayDuration = 650;
        }
      } else if (elapsed >= 10) {
        currentStayDuration = (Math.random() < 0.25) ? 650 : 900;
      } else {
        currentStayDuration = 1200;
      }

      mouse.dataset.clickable = "true";
      mouse.dataset.hitProcessed = "false";
      mouse.style.backgroundImage = "url('mouse_popup.png')";
      mouse.classList.add('up');

      const stayTimeout = setTimeout(() => {
        const index = activeMouseTimeouts.indexOf(stayTimeout);
        if (index > -1) activeMouseTimeouts.splice(index, 1);

        if (mouse.classList.contains('up')) {
          mouse.classList.remove('up');
          mouse.dataset.clickable = "false";

          if (mouse.dataset.hitProcessed !== "true" && isGameRunning) {
            cheeseCount--;
            updateCheeseUI();

            if (cheeseCount <= 0) {
              endGame(false);
              return;
            }
          }
          mouse.dataset.hitProcessed = "false";
        }
      }, currentStayDuration);

      activeMouseTimeouts.push(stayTimeout);
      scheduleNextMouse();
    }

    holes.forEach(hole => {
      const mouse = hole.querySelector('.mouse');
      mouse.addEventListener('mousedown', (e) => {
        if (!isGameRunning || mouse.dataset.clickable !== "true") return;

        mouse.dataset.clickable = "false";
        mouse.dataset.hitProcessed = "true";

        playHitSound();

        score += 100;
        scoreDisplay.textContent = score;

        mouse.style.backgroundImage = "url('mouse_hit.png')";

        setTimeout(() => {
          mouse.classList.remove('up');
        }, 200);
      });
    });

    function startGame() {
      initAudio();
      
      if (!isBgmMuted) {
        bgmAudio.currentTime = 0;
        bgmAudio.play().catch(e => console.log("BGM 자동 재생 차단됨:", e));
      }

      resetGame();
      overlayScreen.classList.add('hidden');

      timerInterval = setInterval(() => {
        timeRemaining--;
        timeDisplay.textContent = timeRemaining;
        adjustDifficulty();

        if (timeRemaining <= 0) {
          endGame(true);
        }
      }, 1000);

      scheduleNextMouse();
    }

    function endGame(isSuccess) {
      isGameRunning = false;
      clearAllTimers();
      clearInterval(timerInterval);

      bgmAudio.pause();

      overlayScreen.classList.remove('hidden');
      homeBtn.classList.remove('hidden');

      let finalScore = score;
      let bonusScore = 0;

      if (isSuccess && cheeseCount > 0) {
        playWinSound();
        bonusScore = cheeseCount * 300;
        finalScore = score + bonusScore;
        overlayTitle.textContent = "🎉 성공! 치즈를 지켜냈습니다!";
      } else {
        playGameOverSound();
        overlayTitle.textContent = "💥 실패! 치즈를 모두 빼앗겼습니다.";
      }

      // 1. TOP 3 갱신
      topScores.push(finalScore);
      topScores.sort((a, b) => b - a);
      topScores = topScores.slice(0, 3);
      localStorage.setItem('cheese_top3', JSON.stringify(topScores));

      // 2. 최근 기록 20개 갱신 (맨 앞에 추가)
      recentScores.unshift(finalScore);
      if (recentScores.length > 20) {
        recentScores = recentScores.slice(0, 20);
      }
      localStorage.setItem('cheese_recent20', JSON.stringify(recentScores));

      // 우측 랭킹판 업데이트
      updateSidebarUI();

      if (isSuccess && cheeseCount > 0) {
        overlayDesc.innerHTML = `획득 점수: ${score}점 | 치즈 보너스(+${bonusScore}점)<br><b>최종 점수: ${finalScore}점</b>`;
      } else {
        overlayDesc.innerHTML = `30초 동안 치즈를 지키지 못했습니다.<br><b>최종 점수: ${finalScore}점</b>`;
      }
      startBtn.textContent = "다시 시작";
    }

    function goHome() {
      overlayTitle.textContent = "🧀 치즈를 지켜라!";
      overlayDesc.innerHTML = "30초 동안 쥐들이 치즈를 훔쳐가지 못하게 잡으세요.<br>치즈 3개를 모두 빼앗기지 않고 지켜내야 합니다!";
      startBtn.textContent = "게임 시작";
      homeBtn.classList.add('hidden');
      resetGame();
      isGameRunning = false;
      bgmAudio.pause();
    }

    startBtn.addEventListener('click', startGame);
    homeBtn.addEventListener('click', goHome);

    updateCheeseUI();
  </script>
</body>
</html>
