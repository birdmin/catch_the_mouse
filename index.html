<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>치즈를 지켜라! - 쥐 잡기 게임</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Pretendard', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 게임 전체 레이아웃 (게임 화면 + 우측 점수판) */
    #main-wrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    /* 게임 컨테이너 */
    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      background: url('background.png') no-repeat center/cover;
      border: 4px solid #444;
      border-radius: 12px;
      overflow: hidden;
      cursor: url('hammer.png') 32 32, auto;
    }

    /* 오른쪽 점수 기록판 */
    #score-board {
      width: 280px;
      height: 540px;
      background: #2a2a2a;
      border: 4px solid #444;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    #score-board h2 {
      margin-top: 0;
      font-size: 20px;
      color: #ffda79;
      border-bottom: 2px solid #444;
      padding-bottom: 10px;
      text-align: center;
    }

    #history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      overflow-y: auto;
      flex-grow: 1;
    }

    #history-list li {
      background: #333;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
    }

    .bonus-text {
      font-size: 12px;
      color: #ffda79;
    }

    /* 상단 UI 바 */
    #ui-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .info-box {
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cheese-icon {
      width: 28px;
      height: 28px;
    }

    #game-rule {
      font-size: 14px;
      color: #ffda79;
    }

    /* 3x3 구멍 영역 */
    .grid-container {
      position: absolute;
      top: 140px;
      left: 180px;
      width: 600px;
      height: 340px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
    }

    .hole {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .mouse {
      position: absolute;
      bottom: -100%;
      width: 110px;
      height: 110px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: bottom 0.15s ease-out;
      cursor: pointer;
    }

    .mouse.up {
      bottom: 10px;
    }

    /* 오버레이 화면 */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .overlay h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #ffda79;
    }

    .overlay p {
      font-size: 18px;
      margin-bottom: 25px;
      text-align: center;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #1a1a1a;
      background-color: #ffda79;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-secondary {
      background-color: #a0a0a0;
      color: #ffffff;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="main-wrapper">
    <!-- 게임 화면 -->
    <div id="game-container">
      <div id="ui-bar">
        <div>
          <div id="game-rule">🎮 조작: 쥐를 클릭해 치즈를 지키세요!</div>
          <div class="info-box">남은 시간: <span id="time-display">30</span>초</div>
        </div>
        <div class="info-box">
          점수: <span id="score-display">0</span>
        </div>
        <div class="info-box">
          치즈: <span id="cheese-container"></span>
        </div>
      </div>

      <div class="grid-container">
        <div class="hole" data-index="0"><div class="mouse"></div></div>
        <div class="hole" data-index="1"><div class="mouse"></div></div>
        <div class="hole" data-index="2"><div class="mouse"></div></div>
        <div class="hole" data-index="3"><div class="mouse"></div></div>
        <div class="hole" data-index="4"><div class="mouse"></div></div>
        <div class="hole" data-index="5"><div class="mouse"></div></div>
        <div class="hole" data-index="6"><div class="mouse"></div></div>
        <div class="hole" data-index="7"><div class="mouse"></div></div>
        <div class="hole" data-index="8"><div class="mouse"></div></div>
      </div>

      <!-- 스타트 / 결과 오버레이 -->
      <div id="overlay-screen" class="overlay">
        <h1 id="overlay-title">🧀 치즈를 지켜라!</h1>
        <p id="overlay-desc">30초 동안 쥐들이 치즈를 훔쳐가지 못하게 잡으세요.<br>치즈가 모두 사라지면 실패합니다!</p>
        <div class="btn-group">
          <button id="start-btn" class="btn">게임 시작</button>
          <button id="home-btn" class="btn btn-secondary hidden">처음으로</button>
        </div>
      </div>
    </div>

    <!-- 우측 점수 기록판 -->
    <div id="score-board">
      <h2>🏆 최근 기록</h2>
      <ul id="history-list">
        <li style="text-align: center; color: #888;">기록이 없습니다.</li>
      </ul>
    </div>
  </div>

  <script>
    let score = 0;
    let timeRemaining = 30;
    let cheeseCount = 3;
    let gameInterval = null;
    let timerInterval = null;
    let isHit = false;
    let isGameRunning = false;
    let historyRecords = [];

    const scoreDisplay = document.getElementById('score-display');
    const timeDisplay = document.getElementById('time-display');
    const cheeseContainer = document.getElementById('cheese-container');
    const overlayScreen = document.getElementById('overlay-screen');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');
    const homeBtn = document.getElementById('home-btn');
    const historyList = document.getElementById('history-list');
    const holes = document.querySelectorAll('.hole');

    function updateCheeseUI() {
      cheeseContainer.innerHTML = '';
      for (let i = 0; i < cheeseCount; i++) {
        const img = document.createElement('img');
        img.src = 'cheese.png';
        img.className = 'cheese-icon';
        cheeseContainer.appendChild(img);
      }
    }

    function resetGame() {
      score = 0;
      timeRemaining = 30;
      cheeseCount = 3;
      isGameRunning = true;
      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeRemaining;
      updateCheeseUI();

      holes.forEach(hole => {
        const mouse = hole.querySelector('.mouse');
        mouse.classList.remove('up');
        mouse.style.backgroundImage = '';
      });
    }

    function getRandomHole() {
      const idx = Math.floor(Math.random() * holes.length);
      return holes[idx];
    }

    function popUpMouse() {
      if (!isGameRunning) return;

      const hole = getRandomHole();
      const mouse = hole.querySelector('.mouse');
      isHit = false;

      mouse.style.backgroundImage = "url('mouse_popup.png')";
      mouse.classList.add('up');

      setTimeout(() => {
        if (mouse.classList.contains('up')) {
          mouse.classList.remove('up');

          if (!isHit && isGameRunning) {
            cheeseCount--;
            updateCheeseUI();

            if (cheeseCount <= 0) {
              endGame(false);
            }
          }
        }
      }, 1000);
    }

    holes.forEach(hole => {
      const mouse = hole.querySelector('.mouse');
      mouse.addEventListener('click', () => {
        if (!isGameRunning || isHit || !mouse.classList.contains('up')) return;

        isHit = true;
        score += 100;
        scoreDisplay.textContent = score;

        mouse.style.backgroundImage = "url('mouse_hit.png')";

        setTimeout(() => {
          mouse.classList.remove('up');
        }, 300);
      });
    });

    function addScoreRecord(finalScore, bonusScore, isSuccess) {
      if (historyRecords.length === 0) {
        historyList.innerHTML = '';
      }

      const li = document.createElement('li');
      if (isSuccess) {
        li.innerHTML = `<b>성공</b> - ${finalScore}점 <br><span class="bonus-text">(치즈 보너스: +${bonusScore}점)</span>`;
      } else {
        li.innerHTML = `<b style="color:#ff5252;">실패</b> - 기록 없음`;
      }

      historyList.prepend(li);
      historyRecords.push({ finalScore, bonusScore, isSuccess });
    }

    function startGame() {
      resetGame();
      overlayScreen.classList.add('hidden');

      timerInterval = setInterval(() => {
        timeRemaining--;
        timeDisplay.textContent = timeRemaining;

        if (timeRemaining <= 0) {
          endGame(true);
        }
      }, 1000);

      gameInterval = setInterval(() => {
        popUpMouse();
      }, 1200);
    }

    function endGame(isSuccess) {
      isGameRunning = false;
      clearInterval(gameInterval);
      clearInterval(timerInterval);

      overlayScreen.classList.remove('hidden');
      homeBtn.classList.remove('hidden');

      if (isSuccess && cheeseCount > 0) {
        const bonusScore = cheeseCount * 500;
        const finalScore = score + bonusScore;
        overlayTitle.textContent = "🎉 성공! 치즈를 지켜냈습니다!";
        overlayDesc.innerHTML = `획득 점수: ${score}점<br>치즈 보너스(+${bonusScore}점)<br><b>최종 점수: ${finalScore}점</b>`;
        startBtn.textContent = "다시 시작";
        addScoreRecord(finalScore, bonusScore, true);
      } else {
        overlayTitle.textContent = "💥 실패! 치즈를 모두 빼앗겼습니다.";
        overlayDesc.textContent = "30초 동안 치즈를 지키지 못했습니다. 다시 도전해보세요!";
        startBtn.textContent = "다시 시작";
        addScoreRecord(0, 0, false);
      }
    }

    function goHome() {
      overlayTitle.textContent = "🧀 치즈를 지켜라!";
      overlayDesc.innerHTML = "30초 동안 쥐들이 치즈를 훔쳐가지 못하게 잡으세요.<br>치즈가 모두 사라지면 실패합니다!";
      startBtn.textContent = "게임 시작";
      homeBtn.classList.add('hidden');
      resetGame();
      isGameRunning = false;
    }

    startBtn.addEventListener('click', startGame);
    homeBtn.addEventListener('click', goHome);

    updateCheeseUI();
  </script>
</body>
</html>
